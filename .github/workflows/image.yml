name: Publish image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/nice-bills/shiftdesk
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit checks
        run: |
          pip install -q -r requirements.txt
          pip install -q --no-deps vendor/openenv-0.6.1.dev0-py3-none-any.whl
          python tests_families.py 60
          python tests_solvers_v3.py 60
          python tests_solvers.py
          python tests_episodes.py
          python tests_v4.py 10
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tag
        id: tag
        run: echo "value=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Smoke test the pushed image
        run: |
          docker run --rm -d --name env-test -p 8000:8000 $IMAGE:${{ steps.tag.outputs.value }}
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 2; done
          openenv validate --url http://localhost:8000
          python tests_ws.py http://localhost:8000
          docker logs env-test | tail -20
          docker stop env-test
